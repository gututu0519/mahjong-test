# Install in /etc/nginx/conf.d/. This file is included in the http context.
# The safe format deliberately excludes query strings, Referer and credentials.
log_format gtt_safe '$remote_addr $host $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=gtt_login:10m rate=10r/m;
upstream gtt_gateway { server 127.0.0.1:8110; keepalive 16; }
upstream gtt_console { server 127.0.0.1:8112; keepalive 16; }

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name gttgames.com www.gttgames.com api.gttgames.com play.gttgames.com merchant.gttgames.com admin.gttgames.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/gtt-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name www.gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-access.log gtt_safe;
    return 308 https://gttgames.com$request_uri;
}
server {
    listen 443 ssl;
    server_name gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-access.log gtt_safe;
    # Initial entry until the independent corporate site is installed.
    location = / { return 302 https://merchant.gttgames.com/; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name api.gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-access.log gtt_safe;
    client_max_body_size 16k;
    location ^~ /gtt/v1/ {
        limit_except POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        # No URI suffix or rewrite: HMAC signs the unchanged request path/body.
        proxy_pass http://gtt_gateway;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name play.gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-play-access.log gtt_safe;
    # Nginx error messages may contain full request URLs; player URLs carry tokens.
    error_log /dev/null crit;
    client_max_body_size 16k;
    location ~ ^/(gtt|sandbox)(/|$) { return 404; }
    location = /health { return 404; }
    location / {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_gateway;
    }
}
server {
    listen 443 ssl;
    server_name merchant.gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-access.log gtt_safe;
    client_max_body_size 16k;
    location = /api/merchant/login {
        limit_req zone=gtt_login burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location ^~ /api/merchant/ {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location ~ ^/(?:admin\.(?:js|css)|deployment\.json|merchant/)?$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name admin.gttgames.com;
    include /etc/nginx/snippets/gtt-tls.conf;
    access_log /var/log/nginx/gtt-access.log gtt_safe;
    client_max_body_size 16k;
    location = /api/admin/login {
        limit_req zone=gtt_login burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location ^~ /api/admin/ {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location ~ ^/(?:admin\.(?:js|css)|deployment\.json|merchant/)?$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/gtt-proxy.conf;
        proxy_pass http://gtt_console;
    }
    location / { return 404; }
}
