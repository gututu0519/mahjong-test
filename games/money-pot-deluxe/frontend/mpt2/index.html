  <script>
    // 載入期間錯誤回報（目前只啟用 GameID 644）：框架載入前（cc.game.init 之前/之中）的錯誤原本完全沒有紀錄
    // window.__loadStage 由 application.ejs / FeatureManagerComponent 更新，標示目前卡在哪個階段
    // 1. 錯誤即時回報 2. 看門狗：畫面在前景累計 10/20/40 秒還沒載完就回報快照 3. 關頁時還沒載完就回報
    //    （分頁在背景或手機切到別的 App 時瀏覽器會暫停畫面更新，這段時間不算，避免誤報；log 的 h= 為背景秒數）
    // 4. 載入狀態暫存在 localStorage，載完才清除；下次開啟若有殘留代表上次沒載完，補送 prev_stuck
    //    （網域暫時連不上、玩家提早關掉時即時 log 送不出去，靠這個補）
    (function () {
      var ENABLE_GAME_IDS = ['644'];
      var MAX_REPORT = 10;
      var WATCHDOG_TIMES = [10000, 20000, 40000];
      var reportCount = 0;
      var reported = {};
      var errors = [];

      function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
      }

      var gameId = getParam('gameID');
      window.__loadStage = 'html';
      window.IsLoadErrorReportGame = ENABLE_GAME_IDS.indexOf(gameId) !== -1;
      if (!window.IsLoadErrorReportGame || getParam('demo') == 'true') return;

      var STORE_KEY = 'slotLoadState_' + gameId;
      var startAt = Date.now();
      var watchdogIndex = 0;
      // 累計在背景的時間
      var hiddenMs = 0;
      var hiddenSince = document.hidden ? Date.now() : 0;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (!hiddenSince) hiddenSince = Date.now();
        } else if (hiddenSince) {
          hiddenMs += Date.now() - hiddenSince;
          hiddenSince = 0;
        }
      });

      function getBrowserSystem(ua) {
        if (/UCBrowser/i.test(ua)) return 4;
        if (/QQBrowser|MQQBrowser/i.test(ua)) return 5;
        if (/MSIE|Trident/i.test(ua)) return 3;
        if (/Chrome|CriOS/i.test(ua)) return 1;
        if (/Safari/i.test(ua)) return 2;
        return 0;
      }

      function getDeviceSystem(ua) {
        if (/Android/i.test(ua)) return 1;
        if (/iPhone|iPad|iPod/i.test(ua)) return 2;
        if (/Windows/i.test(ua)) return 3;
        return 0;
      }

      function getSec() {
        return Math.round((Date.now() - startAt) / 1000);
      }

      function getHiddenMs() {
        return hiddenMs + (hiddenSince ? Date.now() - hiddenSince : 0);
      }

      function getHiddenSec() {
        return Math.round(getHiddenMs() / 1000);
      }

      // 只留檔名（去掉路徑與 query），避免 log 過長
      function fileName(url) {
        var name = String(url || '').split(/[?#]/)[0].split('/').pop() || String(url || '');
        return name.substring(0, 40);
      }

      // 精簡版 UA：系統版本 + 機型 + 瀏覽器版本（+ wv 表示 App 內嵌 WebView），例如 And14 SM-A546E Chrome120 wv / iOS17.5 Safari17
      function shortUA(ua) {
        var m;
        var os = '?';
        if ((m = /Android ([\d.]+)(?:; ([^;)]+))?/.exec(ua))) {
          os = 'And' + m[1] + (m[2] && m[2] != 'K' ? ' ' + m[2].replace(/ Build.*/, '').substring(0, 20) : '');
        } else if ((m = /OS (\d+[_\d]*) like Mac/.exec(ua))) {
          os = 'iOS' + m[1].replace(/_/g, '.');
        } else if (/Windows/.test(ua)) {
          os = 'Win';
        } else if (/Mac OS X/.test(ua)) {
          os = 'Mac';
        }
        var br = /(EdgA|EdgiOS|Edg|OPR|UCBrowser|MQQBrowser|QQBrowser|SamsungBrowser|MiuiBrowser|HeyTapBrowser|CriOS|FxiOS|Firefox|Chrome)\/(\d+)/.exec(ua);
        var browser = br ? br[1] + br[2] : ((m = /Version\/(\d+[.\d]*).*Safari/.exec(ua)) ? 'Safari' + m[1] : '?');
        return os + ' ' + browser + (/; wv\)/.test(ua) ? ' wv' : '');
      }

      // on=是否連網,網路類型,rtt
      function getNetInfo() {
        var c = navigator.connection || {};
        return 'on=' + (navigator.onLine ? 1 : 0) + ',' + (c.effectiveType || '-') + ',' + (c.rtt != undefined ? c.rtt : '-');
      }

      // n=已完成資源數 last=最後完成的檔案@完成時間ms slow=最慢的檔案@耗時ms bad=HTTP錯誤:檔案（pending 中的檔案瀏覽器拿不到）
      function getResourceSnapshot() {
        try {
          var list = performance.getEntriesByType('resource');
          if (!list.length) return 'n=0';
          var last = list[0];
          var slow = list[0];
          var bad = [];
          for (var i = 0; i < list.length; i++) {
            var r = list[i];
            if (r.responseEnd > last.responseEnd) last = r;
            if (r.duration > slow.duration) slow = r;
            if (r.responseStatus >= 400) bad.push(r.responseStatus + ':' + fileName(r.name));
          }
          return 'n=' + list.length +
            ' last=' + fileName(last.name) + '@' + Math.round(last.responseEnd) +
            ' slow=' + fileName(slow.name) + '@' + Math.round(slow.duration) +
            (bad.length ? ' bad=' + bad.slice(0, 2).join(',') : '');
        } catch (e) {
          return 'n=?';
        }
      }

      // 錯誤內容只取前兩行、網址只留檔名、最多 150 字
      function shortDetail(detail) {
        return String(detail || '').split('\n').slice(0, 2).join(' ')
          .replace(/https?:\/\/[^\s'"()]*\//g, '')
          .replace(/\?[^\s'"()]*/g, '')
          .replace(/\s+/g, ' ').substring(0, 150);
      }

      // ErrorLog 上限，避免 DB 欄位截斷；重要資訊放前面，UA 放最後
      var MAX_LOG_LEN = 500;

      function buildUrl(log) {
        var ua = navigator.userAgent;
        var errorLog = log + '|a=' + getParam('apiId') + '|' + getNetInfo() + '|' + shortUA(ua);
        var gs = (getParam('domain_platform') || getParam('gs') || 'gnidnawcs').split('').reverse().join('');
        return 'https://' + gs + '/webservice/event/error?' +
          'AccountID=-1' +
          '&GameID=' + encodeURIComponent(gameId) +
          '&GameVersion=v_000_000' +
          '&ErrorLog=' + encodeURIComponent(errorLog.substring(0, MAX_LOG_LEN)) +
          '&BrowserSystem=' + getBrowserSystem(ua) +
          '&DeviceSystem=' + getDeviceSystem(ua) +
          '&CreateTime=' + encodeURIComponent(new Date().toDateString());
      }

      // 跟框架 SendErrorLog 一樣送到 crash report（webservice/event/error），不帶 ssoKey
      // 一般用原本的 Send；關頁時 XHR 會被瀏覽器取消，改用 fetch keepalive
      function report(type, detail, keepalive) {
        try {
          // 格式：[LoadError]類型|階段|開啟後秒數|h=背景秒數|內容|a=ApiID|網路|UA
          var log = '[LoadError]' + type + '|' + window.__loadStage + '|' + getSec() + 's|h=' + getHiddenSec() + '|' + String(detail || '');
          if (reported[log] || reportCount >= MAX_REPORT) return;
          reported[log] = true;
          reportCount++;
          console.error(log);

          var url = buildUrl(log);
          if (!keepalive && typeof Send == 'function') {
            Send(url);
          } else if (window.fetch) {
            fetch(url, { method: 'GET', mode: 'no-cors', keepalive: true }).catch(function () { });
          } else {
            new Image().src = url;
          }
        } catch (e) { }
      }

      function saveState() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify({
            stage: window.__loadStage,
            sec: getSec(),
            hid: getHiddenSec(),
            // UTC 月-日 時:分，例如 10-12 06:31
            time: new Date().toISOString().substring(5, 16).replace('T', ' '),
            net: getNetInfo(),
            res: getResourceSnapshot(),
            errs: errors.slice(-2)
          }));
        } catch (e) { }
      }

      function clearState() {
        try { localStorage.removeItem(STORE_KEY); } catch (e) { }
      }

      // 上次沒載完：補送
      try {
        var prev = localStorage.getItem(STORE_KEY);
        if (prev) {
          clearState();
          var p = JSON.parse(prev);
          // 內容：上次階段 上次等了幾秒 上次背景秒數 上次時間(UTC) 上次網路 上次資源快照 上次最後兩筆錯誤
          report('prev_stuck', p.stage + ' ' + p.sec + 's h=' + (p.hid || 0) + ' ' + p.time + 'Z ' + p.net + ' ' + p.res +
            ((p.errs && p.errs.length) ? ' e=' + p.errs.join(';') : ''));
        }
      } catch (e) { }

      window.ReportLoadError = function (type, detail) {
        detail = shortDetail(detail);
        errors.push(type + ':' + detail.substring(0, 60));
        saveState();
        report(type, detail);
      };

      function isLoadDone() {
        return window.__loadStage == 'done';
      }

      // 階段改變時更新暫存；載入完成（FeatureManager.Complete）清除暫存並停止看門狗，之後交給框架自己的錯誤處理
      var stage = window.__loadStage;
      try {
        Object.defineProperty(window, '__loadStage', {
          configurable: true,
          get: function () { return stage; },
          set: function (value) {
            stage = value;
            if (value == 'done') {
              clearState();
              clearInterval(watchdogTimer);
              clearInterval(saveTimer);
            } else {
              saveState();
            }
          }
        });
      } catch (e) { }

      saveState();
      // 定時更新暫存，讓 prev_stuck 的秒數接近玩家實際等待的時間
      var saveTimer = setInterval(function () {
        if (!isLoadDone()) saveState();
      }, 3000);

      // 看門狗：只累計畫面在前景的時間，背景時不檢查
      var watchdogTimer = setInterval(function () {
        if (isLoadDone() || watchdogIndex >= WATCHDOG_TIMES.length) {
          clearInterval(watchdogTimer);
          return;
        }
        if (document.hidden) return;
        var visibleMs = Date.now() - startAt - getHiddenMs();
        if (visibleMs >= WATCHDOG_TIMES[watchdogIndex]) {
          watchdogIndex++;
          report('stuck', 'v=' + Math.round(visibleMs / 1000) + 's ' + getResourceSnapshot());
        }
      }, 1000);

      window.addEventListener('pagehide', function () {
        // application.ejs 自動重整時不算玩家離開
        if (isLoadDone() || window.__loadReloading) return;
        saveState();
        report('leave', getResourceSnapshot(), true);
      });

      window.addEventListener('error', function (evt) {
        if (isLoadDone()) return;
        var target = evt && evt.target;
        if (target && target !== window && (target.src || target.href)) {
          // script / img / link 下載失敗
          window.ReportLoadError('resource', (target.tagName || '') + ' ' + fileName(target.src || target.href));
        } else {
          window.ReportLoadError('error', (evt.message || '') + ' @' + fileName(evt.filename) + ':' + (evt.lineno || 0) + ':' + (evt.colno || 0));
        }
      }, true);

      window.addEventListener('unhandledrejection', function (evt) {
        if (isLoadDone()) return;
        var reason = evt && evt.reason;
        window.ReportLoadError('rejection', reason && (reason.stack || reason.message) || reason);
      });
    })();
  </script>
  <script>
    // 遊戲不使用手把：讓 Cocos 偵測不到 Gamepad API，避免 iframe 內的 permissions policy 警告
    try {
      navigator.getGamepads = undefined;
      navigator.webkitGetGamepads = undefined;
    } catch (e) { }
  </script>

  <script>
    function GetLinkParameterByName(name) {
      var url = window.location.href;
      name = name.replace(/[\[\]]/g, '\\$&');
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
        results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    function CheckReplayUrlSkin(name) {
      let zero = "0".charCodeAt( 0 );
      let nine = "9".charCodeAt( 0 );
      let char_a = "a".charCodeAt( 0 );
      let char_z = "z".charCodeAt( 0 );
      let char_A = "A".charCodeAt( 0 );
      let char_Z = "Z".charCodeAt( 0 );

      let decodedData = "";
      for ( let i = 0; i < replayData.length; i++ )
      {
          let data = replayData.charCodeAt( i );
          if ( data >= zero && data <= nine )
          {
              data = nine - ( data - zero );
              decodedData = decodedData + String.fromCharCode( data );
          }
          else if ( data >= char_a && data <= char_z && i % 2 == 0 )
          {
              data = char_z - ( data - char_a );
              decodedData = decodedData + String.fromCharCode( data );
          }
          else if ( data >= char_A && data <= char_Z && i % 3 == 0 )
          {
              data = char_Z - ( data - char_A );
              decodedData = decodedData + String.fromCharCode( data );
          }
          else
          {
              decodedData = decodedData + String.fromCharCode( data );
          }
      }

      let data = atob( decodedData );
      name = name.replace( /[[\]]/g, "\\$&" );
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
      results = regex.exec(data);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    function Log(eventId) {
      var title = document.title;
      var search = location.search.split(/(?:\?|&)/g);
      for (var i = 0; i < search.length; i++) {
        var gameId = search[i].split("gameID=")[1];
        if (gameId) {
          break;
        }
      }

      let apiId = GetLinkParameterByName('apiId');
      if ((apiId == "10210" || apiId == "6") && window.location.href.indexOf("\/fg\/") > 0) {
        gameId = "109";
      }
      if (gameId === null || gameId === undefined) {
        return;
      }
      let SSOKey = GetLinkParameterByName("ssoKey");
      let gs = (GetLinkParameterByName("domain_platform") || GetLinkParameterByName("gs") || "gnidnawcs")
        .split("").reverse().join("");
      let url = "https://" + gs + "/webservice/event/trigger?";
      url += "AccountID=-1&BrowserSystem=-1&DeviceSystem=-1&GameID=" + gameId + "&GameVersion=" + new Date().getTime() + "&EventID=" + eventId +
        "&EventStatus=0&SSOKey=" + SSOKey + "&CreateTime=" + new Date().toISOString() + "&ApiId=" + apiId;
      Send(url);
    }

    function Send(url, isPost, data) {
      var headers = {
        Accept: 'application/json, text/javascript, text/plain',
      };
      var xhr = new XMLHttpRequest();
      var method = "GET";
      if(isPost){
        method = "post";
      }
      xhr.open(method, url, true);

      if (headers) {
        Object.keys(headers).forEach(key => xhr.setRequestHeader(key, headers[key]));
      }

      xhr.timeout = 5000;

      xhr.onload = evt => { };

      xhr.onerror = evt => {
        // Send(url);
      };

      xhr.ontimeout = evt => {
        // Send(url);
      };
      if(isPost){
        xhr.setRequestHeader( 'Content-Type', 'application/json' );
			  xhr.send( JSON.stringify( data ) );
      }
      else{
        xhr.send();
      }
    }

        // 啟用載入錯誤回報的遊戲每次開啟都送，後端才能統計「有 852 沒有 853」（卡在 cc.game.init）的比例

          xhr.send();
        }

    };
