# Use only during initial HTTP-01 certificate issuance, before enabling TLS config.
server {
    listen 80 default_server;
    server_name gttgames.com www.gttgames.com api.gttgames.com play.gttgames.com merchant.gttgames.com admin.gttgames.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/gtt-acme; }
    location / { return 503; }
}
