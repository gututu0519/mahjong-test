<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GTT · 管理控制台</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body>
  <section id="login" class="login-shell" hidden>
    <div class="login-intro"><div class="brand">GTT<span>GAME TECHNOLOGY</span></div><div class="intro-copy"><p class="eyebrow">PARTNER OPERATIONS</p><h1>连接游戏。<br>掌握每一笔交易。</h1><p>GTT 商户、游戏授权与交易运营工作台。</p></div><span class="intro-foot">GTT MANAGEMENT CONSOLE · 01</span></div>

  </section>
  <div id="app" class="shell" hidden>
    <aside class="sidebar"><div class="brand">GTT<span>MANAGEMENT CONSOLE</span></div><p class="nav-label">WORKSPACE</p><nav id="navigation" aria-label="主导航"><button data-view="overview">◈ <span>运营概览</span></button><button data-view="merchants">▦ <span>商户管理</span></button><button data-view="games">◇ <span>游戏目录</span></button><button data-view="transactions">⇄ <span>交易中心</span></button><button data-view="audit">≡ <span>操作审计</span></button><button data-view="users" data-permission="users.manage">♙ <span>账户与权限</span></button></nav><div class="sidebar-bottom"><span class="connection-dot"></span> GTT OPERATIONS <span class="version">V1.0</span></div></aside>

  </div>
