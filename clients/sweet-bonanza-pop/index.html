if (window.location.href.indexOf("replayGame.do") != -1)

 var URLGameSymbol = "_unknown_game_symbol_from_url_";
 var LoadingStep = 0;

 var UHT_SEND_ERRORS = true;
 var UHT_HAD_ERRORS = false;
 
 window.onerror = function(messageOrEvent, source, lineno, colno)
 {
 
  if (!UHT_SEND_ERRORS)
	return;

  UHT_HAD_ERRORS = true;
	
  var args = null;

  if (messageOrEvent instanceof Event)
   args = [messageOrEvent["message"], messageOrEvent["fileName"], messageOrEvent["lineNumber"], messageOrEvent["columnNumber"]];
  else
   args = [messageOrEvent, source, lineno, colno];

  args[1] = String(args[1]).split("?").shift().split("/").pop();

  var msg = args[0] + " at " + args[1] + ":" + args[2] + ":" + args[3];
  ga('BehaviourTracker.send', 'event', "uht_errors", msg, URLGameSymbol, 1);

  window.onerror = null;
 };

 window.onbeforeunload = function()
 {
	var step = LoadingStep.toString() + (LoadingStep+1).toString();
	var lastStep = LoadingStep.toString();

	if (LoadingStep == 4)
	{
		step = "PLAYING";
		lastStep = "PLAYING"
	}

	ga('LoadingTracker.send', 'event', "uht_loading", "_CLOSED_error_" + step, URLGameSymbol, UHT_HAD_ERRORS?1:0);
 
	if (LoadingStep > 1)
		globalTracking.StopTimerAndSend("uht_loading", "_CLOSED_at_" + lastStep, "LoadingTracker");
 	else
		if (GA_timer_load_start != undefined)
			ga('LoadingTracker.send', 'timer', "uht_loading", "_CLOSED_at_1", URLGameSymbol, new Date().getTime() - GA_timer_load_start);

	UHT_SEND_ERRORS = false;

	if (SendTrackingIfQueued != undefined)
	{
		SendTrackingIfQueued();
		SendTrackingIfQueued();
		SendTrackingIfQueued();
		SendTrackingIfQueued();
	}
	
	return;
 }
 
 
 var game_symbol_from_url = (function()
 {
  var params = [];
  var urlSplitted = location.href.split("?");
  if (urlSplitted.length > 1)
  {
   var paramsSplitted = urlSplitted[1].split("&");
   for(var i = 0; i < paramsSplitted.length; ++i)
   {
    var paramSplitted = paramsSplitted[i].split("=");
    params[paramSplitted[0]] = (paramSplitted.length > 1) ? paramSplitted[1] : null;
   }
  }
  return params["symbol"];
 })();

 var game_symbol_from_url_value = game_symbol_from_url;

 if (game_symbol_from_url_value != undefined)
  URLGameSymbol = game_symbol_from_url_value;

	ga('create', ua_id, ua_params);
	var sampleRate = ua_params.sampleRate;
	if (ua_params.name != "WasabiTracker")
		sampleRate /= 10;
	if (Math.random() <= (sampleRate/100))
	{
		gtag('config', ga4_id, {
			send_page_view: false
		});
		gaMapping[ua_params.name] = ga4_id;
	}
}

    {
      shouldHide = true;
      return;
    }

      return;

    {
      window.removeEventListener("resize", onResize, false);

        var ppLogoAnim = document.getElementById("ppLogoAnim");

          ppLogoAnim.remove();
        var loadingBarGradient = document.getElementById("loadingBarGradient");
        if (loadingBarGradient != null)
          loadingBarGradient.remove();
        var gradientContainer = document.getElementById("gradientContainer");
        if (gradientContainer != null)
          gradientContainer.remove();
        });
    }
    setTimeout(function(){hide()}, 1000);
    }
    var onResize = function()
    {
      var logoContainer = document.getElementById("logoSG");
      if (logoContainer != null)
        logoContainer.remove();
      var ppLogoAnim = document.getElementById("blackBG");
      if (ppLogoAnim != null)
        ppLogoAnim.remove();
      var ppLogoAnim = document.getElementById("gradientSG");
      if (ppLogoAnim != null)
        ppLogoAnim.remove();
    }
    window.addEventListener("resize", onResize, false);
    window.addEventListener("DOMContentLoaded", onResize, false);
    var registerAnimationEnd = function()
    {
      animationFinished = true;
      if (shouldHide)
        HideLoaderFP();
    }
    window.addEventListener("DOMContentLoaded", registerAnimationEnd, false);
  }
  else
  {
    var playedIntroAnim = false;
    var animationFinished = false;
    var shouldHide = false;
    var hideAlreadyCalled = false;
    var timeoutResize = null;
    window.HideLoaderFP = function()
    {
      if (!animationFinished)
      {
        shouldHide = true;
      return;
      }
      if (hideAlreadyCalled)
        return;

      hideAlreadyCalled = true;
      function hide()
      {
        var onAnimationEnd = function() {
        var logoContainer = document.getElementById("logoContainer");
        if (logoContainer != null)
          logoContainer.remove();
        var ppLogoAnim = document.getElementById("logoSG");
        if (ppLogoAnim != null)
          ppLogoAnim.remove();
        var gradientContainer = document.getElementById("gradientContainer");
        if (gradientContainer != null)
          gradientContainer.remove();
        if (timeoutResize != null)
          clearTimeout(timeoutResize);
        window.removeEventListener("resize", onResize, false);
        if (timeoutResize != null)
          clearTimeout(timeoutResize);
        };
         var logoSG = document.getElementById("logoSG");

        logoSG.addEventListener("animationend", onAnimationEnd,false);
        logoSG.addEventListener("oanimationend", onAnimationEnd,false);
        window.removeEventListener("resize", onResize, false);
        logoSG.style.animation = 'none';
        logoSG.offsetHeight;
        logoSG.style.animation = null;
        logoSG.style.opacity = 1;
        document.getElementById("blackBG").style.animation = 'none';
        document.getElementById("blackBG").offsetHeight;
        document.getElementById("blackBG").style.animation = null;
        document.getElementById("blackBG").style.opacity = 1;
        document.getElementById("gradientSG").style.animation = 'none';
        document.getElementById("gradientSG").offsetHeight;
        document.getElementById("gradientSG").style.animation = null;
        document.getElementById("gradientSG").style.opacity = 1;
        document.getElementById("blackBG").style.animation="fadeInFromNone 0.5s reverse forwards 1s ease-out";
        document.getElementById("gradientSG").style.animation="fadeInFromNone 0.5s reverse forwards 1s ease-out";
        logoSG.style.animation="fadeInFromNone 0.5s reverse forwards 1s ease-out";
      }
      setTimeout(function(){hide()}, 2000);
    }
    var onResize = function()
    {
      var logoContainer = document.getElementById("logoInContainer");
      if (logoContainer != null)
        logoContainer.remove();
      var ppLogoAnim = document.getElementById("ppLogoAnim");
      if (ppLogoAnim != null)
        ppLogoAnim.remove();
      var loadingBarGradient = document.getElementById("loadingBarGradient");
      if (loadingBarGradient != null)
        loadingBarGradient.remove();

      var logoSGimg = document.getElementById("logoSGimg");
      var logoSG = document.getElementById("logoSG");

      if (timeoutResize != null)
        clearTimeout(timeoutResize);
      timeoutResize = setTimeout(onResize, 50);

      if (logoSG == null)
      {
        return;
      }

        var onAnimationEnd = function() {
          animationFinished = true;
          logoSG.removeEventListener("webkitAnimationEnd", onAnimationEnd, false);
          logoSG.removeEventListener("animationend", onAnimationEnd, false);
          logoSG.removeEventListener("oanimationend", onAnimationEnd, false);
          if (shouldHide)
            HideLoaderFP();
        };
        var logoSG = document.getElementById("logoSG");
        logoSG.addEventListener("webkitAnimationEnd", onAnimationEnd,false);
        logoSG.addEventListener("animationend", onAnimationEnd,false);
        logoSG.addEventListener("oanimationend", onAnimationEnd,false);
        logoSG.style.animation="fadeInFromNone 0.5s normal forwards 0.6s ease-in";
        var gradientSG = document.getElementById("gradientSG");
        gradientSG.style.animation="fadeInFromNone 0.5s normal forwards 0.5s ease-in";
      }
    }
    window.addEventListener("resize", onResize, false);
    window.addEventListener("DOMContentLoaded", onResize, false);
    if (document.readyState !== 'loading') {
        onResize();
    } else {
        window.addEventListener("DOMContentLoaded", onResize, false);
    }
    timeoutResize = setTimeout(onResize, 50);
  }
